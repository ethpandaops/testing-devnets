name: Ansible lint
on:
  pull_request:
    paths:
      - 'ansible/**'
      - '.tool-versions'
  push:
    branches:
      - master
    paths:
      - 'ansible/**'
      - '.tool-versions'

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install asdf
        uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Install asdf tools
        run: ./asdf-setup.sh

      - name: Install ansible role/collection dependencies
        working-directory: ./ansible
        run: ./install_dependencies.sh

      - name: Lint
        working-directory: ./ansible
        run: >
          ansible-lint playbook.yaml
          --nocolor
          --exclude vendor
          --exclude '*.sops.yaml'
          --profile production
          --skip-list 'name[play]'
          --skip-list 'meta-no-info'
          --skip-list 'yaml[line-length]'
          --skip-list 'command-instead-of-shell'
